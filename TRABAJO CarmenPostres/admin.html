<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Carmen Postres Caseros</title>
    <link rel="icon" type="image/jpeg" href="imagen/Logo ofi.png">
    <link rel="stylesheet" href="Datos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-wrap { max-width: 900px; margin: 20px auto; padding: 0 16px; }
        .admin-card { background: #fffaf6; border: 1px solid #e5d4cc; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .admin-card pre { background: #f5f0ec; padding: 10px; border-radius: 6px; overflow-x: auto; }
        #login-estado, #admin-estado { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html">
            <img src="imagen/Logo ofi.png" alt="Logo de Carmen Postres Caseros">
            <span class="logo-text">
                <span class="logo-nombre">Carmen</span>
                <span class="logo-lema">Postres caseros</span>
            </span>
        </a>
    </header>

    <div class="admin-wrap">
        <section id="admin-login">
            <h1>Panel de administración</h1>
            <p>Inicia sesión con tu cuenta de administrador.</p>
            <form id="form-login" action="#" method="post">
                <div class="campo">
                    <label for="admin-email">Correo:</label>
                    <input type="email" id="admin-email" required>
                </div>
                <div class="campo">
                    <label for="admin-password">Contraseña:</label>
                    <input type="password" id="admin-password" required>
                </div>
                <div class="botones">
                    <button type="submit" class="btn-enviar">Entrar</button>
                </div>
            </form>
            <div id="login-estado" hidden></div>
        </section>

        <section id="admin-panel" style="display:none;">
            <h1>Panel de administración</h1>
            <div class="botones">
                <button id="btn-refresh" class="btn-enviar">Actualizar</button>
                <button id="btn-logout" class="btn-limpiar">Cerrar sesión</button>
            </div>
            <div id="admin-estado" hidden></div>

            <h2>Pedidos</h2>
            <div id="lista-pedidos"></div>

            <h2>Comprobantes</h2>
            <div id="lista-comprobantes"></div>
        </section>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
